services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - backend

  prediction-service:
    build:
      context: ./prediction-service
      dockerfile: Dockerfile
    volumes:
      - shared_models:/shared:ro
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  training-service:
    build:
      context: ./training-service
      dockerfile: Dockerfile
    volumes:
      - shared_models:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      prediction-service:
        condition: service_healthy
      training-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - frontend

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    depends_on:
      gateway-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

volumes:
  postgres_data:
  shared_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/shared

networks:
  backend:
    internal: false
  frontend:
    internal: false
