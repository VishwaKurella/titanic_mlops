services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mlplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mlplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway-service:
    build: ./gateway-service
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      prediction-service:
        condition: service_healthy
      training-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prediction-service:
    build: ./prediction-service
    volumes:
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  training-service:
    build: ./training-service
    ports:
      - "8001:8001"
    volumes:
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-dashboard:
    build: ./admin-dashboard
    ports:
      - "3000:3000"
    depends_on:
      gateway-service:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8080

volumes:
  postgres_data:
